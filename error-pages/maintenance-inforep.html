<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManiaJ | We Have Moved</title>
  <link rel="stylesheet" type="text/css" href="/assets/css/custom/base.css">
  <link rel="stylesheet" href="https://jsdelivr.net">
  <style>
    body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .migration-card { max-width: 600px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; text-align: center; }
    .new-brand-text { color: #0d6efd; font-weight: bold; }
    .redirect-loader { border: 3px solid #f3f3f3; border-top: 3px solid #0d6efd; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="migration-card">
    <h1 class="mb-4">We’ve Moved!</h1>
    <p class="lead mb-4">
      To provide you with a better experience, our site has moved to a new home. 
      Please update your bookmarks to our new address.
    </p>
    
    <div class="p-4 mb-4 bg-light rounded border">
      <p class="mb-1 text-muted text-uppercase small fw-bold">New URL</p>
      <!--h4 class="new-brand-text">info.maniaj.com/wholesale</h4-->
    </div>

    <!-- target="_top" is essential to escape the Heroku iframe -->
    <a href="https://info.maniaj.com/wholesale" target="_top" class="btn btn-primary btn-lg px-5 py-3 shadow w-100">
      Go to New Site
    </a>
  </div>
</body>
</html>
